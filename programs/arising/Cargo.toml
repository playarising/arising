[package]
name = "arising"
version = "1.0.0"
description = "Arising is a Solana RPG where NFT heroes evolve by completing jobs and quests in real time."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arising"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"
mpl-token-metadata = "5"

[dev-dependencies]
litesvm = "0.8.1"
solana-account = "3.0"
solana-instruction = "3.0"
solana-keypair = "3.1"
solana-pubkey = "4.0"
solana-signer = "3.0"
solana-message = "3.0"
solana-transaction = "3.0"
solana-transaction-error = "3.0"
solana-clock = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

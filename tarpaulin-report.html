<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        var data = {"files":[{"path":["/","Users","eabz","Documents","GitHub","arising","patches","solana-account-info","src","debug_account_data.rs"],"content":"//! Debug-formatting of account data.\n\nuse std::{cmp, fmt};\n\npub(crate) const MAX_DEBUG_ACCOUNT_DATA: usize = 64;\n\n/// Format data as hex.\n///\n/// If `data`'s length is greater than 0, add a field called \"data\" to `f`. The\n/// first 64 bytes of `data` is displayed; bytes after that are ignored.\npub fn debug_account_data(data: \u0026[u8], f: \u0026mut fmt::DebugStruct\u003c'_, '_\u003e) {\n    let data_len = cmp::min(MAX_DEBUG_ACCOUNT_DATA, data.len());\n    if data_len \u003e 0 {\n        f.field(\"data\", \u0026Hex(\u0026data[..data_len]));\n    }\n}\n\npub(crate) struct Hex\u003c'a\u003e(pub(crate) \u0026'a [u8]);\nimpl fmt::Debug for Hex\u003c'_\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        for \u0026byte in self.0 {\n            write!(f, \"{byte:02x}\")?;\n        }\n        Ok(())\n    }\n}\n","traces":[{"line":11,"address":[],"length":0,"stats":{"Line":0}},{"line":12,"address":[],"length":0,"stats":{"Line":0}},{"line":13,"address":[],"length":0,"stats":{"Line":0}},{"line":14,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":8},{"path":["/","Users","eabz","Documents","GitHub","arising","patches","solana-account-info","src","lib.rs"],"content":"//! Account information.\n#![cfg_attr(docsrs, feature(doc_auto_cfg))]\nuse {\n    solana_program_error::ProgramError,\n    solana_program_memory::sol_memset,\n    solana_pubkey::Pubkey,\n    std::{\n        cell::{Ref, RefCell, RefMut},\n        fmt,\n        rc::Rc,\n        slice::from_raw_parts_mut,\n    },\n};\npub mod debug_account_data;\n\n/// Maximum number of bytes a program may add to an account during a single realloc\npub const MAX_PERMITTED_DATA_INCREASE: usize = 1_024 * 10;\n\n/// Account information\n#[derive(Clone)]\n#[repr(C)]\npub struct AccountInfo\u003c'a\u003e {\n    /// Public key of the account\n    pub key: \u0026'a Pubkey,\n    /// The lamports in the account.  Modifiable by programs.\n    pub lamports: Rc\u003cRefCell\u003c\u0026'a mut u64\u003e\u003e,\n    /// The data held in this account.  Modifiable by programs.\n    pub data: Rc\u003cRefCell\u003c\u0026'a mut [u8]\u003e\u003e,\n    /// Program that owns this account\n    pub owner: \u0026'a Pubkey,\n    /// The epoch at which this account will next owe rent\n    pub rent_epoch: u64,\n    /// Was the transaction signed by this account's public key?\n    pub is_signer: bool,\n    /// Is the account writable?\n    pub is_writable: bool,\n    /// This account's data contains a loaded program (and is now read-only)\n    pub executable: bool,\n}\n\nimpl fmt::Debug for AccountInfo\u003c'_\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        let mut f = f.debug_struct(\"AccountInfo\");\n\n        f.field(\"key\", \u0026self.key)\n            .field(\"owner\", \u0026self.owner)\n            .field(\"is_signer\", \u0026self.is_signer)\n            .field(\"is_writable\", \u0026self.is_writable)\n            .field(\"executable\", \u0026self.executable)\n            .field(\"rent_epoch\", \u0026self.rent_epoch)\n            .field(\"lamports\", \u0026self.lamports())\n            .field(\"data.len\", \u0026self.data_len());\n        debug_account_data::debug_account_data(\u0026self.data.borrow(), \u0026mut f);\n\n        f.finish_non_exhaustive()\n    }\n}\n\nimpl\u003c'a\u003e AccountInfo\u003c'a\u003e {\n    pub fn signer_key(\u0026self) -\u003e Option\u003c\u0026Pubkey\u003e {\n        if self.is_signer {\n            Some(self.key)\n        } else {\n            None\n        }\n    }\n\n    pub fn unsigned_key(\u0026self) -\u003e \u0026Pubkey {\n        self.key\n    }\n\n    pub fn lamports(\u0026self) -\u003e u64 {\n        **self.lamports.borrow()\n    }\n\n    pub fn try_lamports(\u0026self) -\u003e Result\u003cu64, ProgramError\u003e {\n        Ok(**self.try_borrow_lamports()?)\n    }\n\n    /// Return the account's original data length when it was serialized for the\n    /// current program invocation.\n    ///\n    /// # Safety\n    ///\n    /// This method assumes that the original data length was serialized as a u32\n    /// integer in the 4 bytes immediately preceding the serialized account key.\n    pub unsafe fn original_data_len(\u0026self) -\u003e usize {\n        let key_ptr = self.key as *const _ as *const u8;\n        let original_data_len_ptr = key_ptr.offset(-4) as *const u32;\n        *original_data_len_ptr as usize\n    }\n\n    pub fn data_len(\u0026self) -\u003e usize {\n        self.data.borrow().len()\n    }\n\n    pub fn try_data_len(\u0026self) -\u003e Result\u003cusize, ProgramError\u003e {\n        Ok(self.try_borrow_data()?.len())\n    }\n\n    pub fn data_is_empty(\u0026self) -\u003e bool {\n        self.data.borrow().is_empty()\n    }\n\n    pub fn try_data_is_empty(\u0026self) -\u003e Result\u003cbool, ProgramError\u003e {\n        Ok(self.try_borrow_data()?.is_empty())\n    }\n\n    pub fn try_borrow_lamports(\u0026self) -\u003e Result\u003cRef\u003c'_, \u0026mut u64\u003e, ProgramError\u003e {\n        self.lamports\n            .try_borrow()\n            .map_err(|_| ProgramError::AccountBorrowFailed)\n    }\n\n    pub fn try_borrow_mut_lamports(\u0026self) -\u003e Result\u003cRefMut\u003c'_, \u0026'a mut u64\u003e, ProgramError\u003e {\n        self.lamports\n            .try_borrow_mut()\n            .map_err(|_| ProgramError::AccountBorrowFailed)\n    }\n\n    pub fn try_borrow_data(\u0026self) -\u003e Result\u003cRef\u003c'_, \u0026mut [u8]\u003e, ProgramError\u003e {\n        self.data\n            .try_borrow()\n            .map_err(|_| ProgramError::AccountBorrowFailed)\n    }\n\n    pub fn try_borrow_mut_data(\u0026self) -\u003e Result\u003cRefMut\u003c'_, \u0026'a mut [u8]\u003e, ProgramError\u003e {\n        self.data\n            .try_borrow_mut()\n            .map_err(|_| ProgramError::AccountBorrowFailed)\n    }\n\n    /// Realloc the account's data and optionally zero-initialize the new\n    /// memory.\n    ///\n    /// Note:  Account data can be increased within a single call by up to\n    /// `solana_program::entrypoint::MAX_PERMITTED_DATA_INCREASE` bytes.\n    ///\n    /// Note: Memory used to grow is already zero-initialized upon program\n    /// entrypoint and re-zeroing it wastes compute units.  If within the same\n    /// call a program reallocs from larger to smaller and back to larger again\n    /// the new space could contain stale data.  Pass `true` for `zero_init` in\n    /// this case, otherwise compute units will be wasted re-zero-initializing.\n    ///\n    /// # Safety\n    ///\n    /// This method makes assumptions about the layout and location of memory\n    /// referenced by `AccountInfo` fields. It should only be called for\n    /// instances of `AccountInfo` that were created by the runtime and received\n    /// in the `process_instruction` entrypoint of a program.\n    pub fn realloc(\u0026self, new_len: usize, zero_init: bool) -\u003e Result\u003c(), ProgramError\u003e {\n        let mut data = self.try_borrow_mut_data()?;\n        let old_len = data.len();\n\n        // Return early if length hasn't changed\n        if new_len == old_len {\n            return Ok(());\n        }\n\n        // Return early if the length increase from the original serialized data\n        // length is too large and would result in an out of bounds allocation.\n        let original_data_len = unsafe { self.original_data_len() };\n        if new_len.saturating_sub(original_data_len) \u003e MAX_PERMITTED_DATA_INCREASE {\n            return Err(ProgramError::InvalidRealloc);\n        }\n\n        // realloc\n        unsafe {\n            let data_ptr = data.as_mut_ptr();\n\n            // First set new length in the serialized data\n            *(data_ptr.offset(-8) as *mut u64) = new_len as u64;\n\n            // Then recreate the local slice with the new length\n            *data = from_raw_parts_mut(data_ptr, new_len)\n        }\n\n        if zero_init {\n            let len_increase = new_len.saturating_sub(old_len);\n            if len_increase \u003e 0 {\n                sol_memset(\u0026mut data[old_len..], 0, len_increase);\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Resize the account's data: Either truncating or zero extending.\n    ///\n    /// Note:  Account data can be increased within a single call by up to\n    /// `solana_program::entrypoint::MAX_PERMITTED_DATA_INCREASE` bytes.\n    ///\n    /// # Safety\n    ///\n    /// This method makes assumptions about the layout and location of memory\n    /// referenced by `AccountInfo` fields. It should only be called for\n    /// instances of `AccountInfo` that were created by the runtime and received\n    /// in the `process_instruction` entrypoint of a program.\n    pub fn resize(\u0026self, new_len: usize) -\u003e Result\u003c(), ProgramError\u003e {\n        self.realloc(new_len, true)\n    }\n\n    #[allow(invalid_reference_casting)]\n    pub fn assign(\u0026self, new_owner: \u0026Pubkey) {\n        // Set the non-mut owner field\n        unsafe {\n            std::ptr::write_volatile(\n                self.owner as *const Pubkey as *mut [u8; 32],\n                new_owner.to_bytes(),\n            );\n        }\n    }\n\n    pub fn new(\n        key: \u0026'a Pubkey,\n        is_signer: bool,\n        is_writable: bool,\n        lamports: \u0026'a mut u64,\n        data: \u0026'a mut [u8],\n        owner: \u0026'a Pubkey,\n        executable: bool,\n        rent_epoch: u64,\n    ) -\u003e Self {\n        Self {\n            key,\n            is_signer,\n            is_writable,\n            lamports: Rc::new(RefCell::new(lamports)),\n            data: Rc::new(RefCell::new(data)),\n            owner,\n            executable,\n            rent_epoch,\n        }\n    }\n\n    #[cfg(feature = \"bincode\")]\n    pub fn deserialize_data\u003cT: serde::de::DeserializeOwned\u003e(\u0026self) -\u003e Result\u003cT, bincode::Error\u003e {\n        bincode::deserialize(\u0026self.data.borrow())\n    }\n\n    #[cfg(feature = \"bincode\")]\n    pub fn serialize_data\u003cT: serde::Serialize\u003e(\u0026self, state: \u0026T) -\u003e Result\u003c(), bincode::Error\u003e {\n        if bincode::serialized_size(state)? \u003e self.data_len() as u64 {\n            return Err(Box::new(bincode::ErrorKind::SizeLimit));\n        }\n        bincode::serialize_into(\u0026mut self.data.borrow_mut()[..], state)\n    }\n}\n\n/// Constructs an `AccountInfo` from self, used in conversion implementations.\npub trait IntoAccountInfo\u003c'a\u003e {\n    fn into_account_info(self) -\u003e AccountInfo\u003c'a\u003e;\n}\nimpl\u003c'a, T: IntoAccountInfo\u003c'a\u003e\u003e From\u003cT\u003e for AccountInfo\u003c'a\u003e {\n    fn from(src: T) -\u003e Self {\n        src.into_account_info()\n    }\n}\n\n/// Provides information required to construct an `AccountInfo`, used in\n/// conversion implementations.\npub trait Account {\n    fn get(\u0026mut self) -\u003e (\u0026mut u64, \u0026mut [u8], \u0026Pubkey, bool, u64);\n}\n\n/// Convert (\u0026'a Pubkey, \u0026'a mut T) where T: Account into an `AccountInfo`\nimpl\u003c'a, T: Account\u003e IntoAccountInfo\u003c'a\u003e for (\u0026'a Pubkey, \u0026'a mut T) {\n    fn into_account_info(self) -\u003e AccountInfo\u003c'a\u003e {\n        let (key, account) = self;\n        let (lamports, data, owner, executable, rent_epoch) = account.get();\n        AccountInfo::new(\n            key, false, false, lamports, data, owner, executable, rent_epoch,\n        )\n    }\n}\n\n/// Convert (\u0026'a Pubkey, bool, \u0026'a mut T)  where T: Account into an\n/// `AccountInfo`.\nimpl\u003c'a, T: Account\u003e IntoAccountInfo\u003c'a\u003e for (\u0026'a Pubkey, bool, \u0026'a mut T) {\n    fn into_account_info(self) -\u003e AccountInfo\u003c'a\u003e {\n        let (key, is_signer, account) = self;\n        let (lamports, data, owner, executable, rent_epoch) = account.get();\n        AccountInfo::new(\n            key, is_signer, false, lamports, data, owner, executable, rent_epoch,\n        )\n    }\n}\n\n/// Convert \u0026'a mut (Pubkey, T) where T: Account into an `AccountInfo`.\nimpl\u003c'a, T: Account\u003e IntoAccountInfo\u003c'a\u003e for \u0026'a mut (Pubkey, T) {\n    fn into_account_info(self) -\u003e AccountInfo\u003c'a\u003e {\n        let (ref key, account) = self;\n        let (lamports, data, owner, executable, rent_epoch) = account.get();\n        AccountInfo::new(\n            key, false, false, lamports, data, owner, executable, rent_epoch,\n        )\n    }\n}\n\n/// Convenience function for accessing the next item in an [`AccountInfo`]\n/// iterator.\n///\n/// This is simply a wrapper around [`Iterator::next`] that returns a\n/// [`ProgramError`] instead of an option.\n///\n/// # Errors\n///\n/// Returns [`ProgramError::NotEnoughAccountKeys`] if there are no more items in\n/// the iterator.\n///\n/// # Examples\n///\n/// ```\n/// use solana_program_error::ProgramResult;\n/// use solana_account_info::{AccountInfo, next_account_info};\n/// use solana_pubkey::Pubkey;\n/// # use solana_program_error::ProgramError;\n///\n/// pub fn process_instruction(\n///     program_id: \u0026Pubkey,\n///     accounts: \u0026[AccountInfo],\n///     instruction_data: \u0026[u8],\n/// ) -\u003e ProgramResult {\n///     let accounts_iter = \u0026mut accounts.iter();\n///     let signer = next_account_info(accounts_iter)?;\n///     let payer = next_account_info(accounts_iter)?;\n///\n///     // do stuff ...\n///\n///     Ok(())\n/// }\n/// # let p = Pubkey::new_unique();\n/// # let l = \u0026mut 0;\n/// # let d = \u0026mut [0u8];\n/// # let a = AccountInfo::new(\u0026p, false, false, l, d, \u0026p, false, 0);\n/// # let accounts = \u0026[a.clone(), a];\n/// # process_instruction(\n/// #    \u0026Pubkey::new_unique(),\n/// #    accounts,\n/// #    \u0026[],\n/// # )?;\n/// # Ok::\u003c(), ProgramError\u003e(())\n/// ```\npub fn next_account_info\u003c'a, 'b, I: Iterator\u003cItem = \u0026'a AccountInfo\u003c'b\u003e\u003e\u003e(\n    iter: \u0026mut I,\n) -\u003e Result\u003cI::Item, ProgramError\u003e {\n    iter.next().ok_or(ProgramError::NotEnoughAccountKeys)\n}\n\n/// Convenience function for accessing multiple next items in an [`AccountInfo`]\n/// iterator.\n///\n/// Returns a slice containing the next `count` [`AccountInfo`]s.\n///\n/// # Errors\n///\n/// Returns [`ProgramError::NotEnoughAccountKeys`] if there are not enough items\n/// in the iterator to satisfy the request.\n///\n/// # Examples\n///\n/// ```\n/// use solana_program_error::ProgramResult;\n/// use solana_account_info::{AccountInfo, next_account_info, next_account_infos};\n/// use solana_pubkey::Pubkey;\n/// # use solana_program_error::ProgramError;\n///\n/// pub fn process_instruction(\n///     program_id: \u0026Pubkey,\n///     accounts: \u0026[AccountInfo],\n///     instruction_data: \u0026[u8],\n/// ) -\u003e ProgramResult {\n///     let accounts_iter = \u0026mut accounts.iter();\n///     let signer = next_account_info(accounts_iter)?;\n///     let payer = next_account_info(accounts_iter)?;\n///     let outputs = next_account_infos(accounts_iter, 3)?;\n///\n///     // do stuff ...\n///\n///     Ok(())\n/// }\n/// # let p = Pubkey::new_unique();\n/// # let l = \u0026mut 0;\n/// # let d = \u0026mut [0u8];\n/// # let a = AccountInfo::new(\u0026p, false, false, l, d, \u0026p, false, 0);\n/// # let accounts = \u0026[a.clone(), a.clone(), a.clone(), a.clone(), a];\n/// # process_instruction(\n/// #    \u0026Pubkey::new_unique(),\n/// #    accounts,\n/// #    \u0026[],\n/// # )?;\n/// # Ok::\u003c(), ProgramError\u003e(())\n/// ```\npub fn next_account_infos\u003c'a, 'b: 'a\u003e(\n    iter: \u0026mut std::slice::Iter\u003c'a, AccountInfo\u003c'b\u003e\u003e,\n    count: usize,\n) -\u003e Result\u003c\u0026'a [AccountInfo\u003c'b\u003e], ProgramError\u003e {\n    let accounts = iter.as_slice();\n    if accounts.len() \u003c count {\n        return Err(ProgramError::NotEnoughAccountKeys);\n    }\n    let (accounts, remaining) = accounts.split_at(count);\n    *iter = remaining.iter();\n    Ok(accounts)\n}\n\nimpl\u003c'a\u003e AsRef\u003cAccountInfo\u003c'a\u003e\u003e for AccountInfo\u003c'a\u003e {\n    fn as_ref(\u0026self) -\u003e \u0026AccountInfo\u003c'a\u003e {\n        self\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use {\n        super::*,\n        crate::debug_account_data::{Hex, MAX_DEBUG_ACCOUNT_DATA},\n    };\n\n    #[test]\n    fn test_next_account_infos() {\n        let k1 = Pubkey::new_unique();\n        let k2 = Pubkey::new_unique();\n        let k3 = Pubkey::new_unique();\n        let k4 = Pubkey::new_unique();\n        let k5 = Pubkey::new_unique();\n        let l1 = \u0026mut 0;\n        let l2 = \u0026mut 0;\n        let l3 = \u0026mut 0;\n        let l4 = \u0026mut 0;\n        let l5 = \u0026mut 0;\n        let d1 = \u0026mut [0u8];\n        let d2 = \u0026mut [0u8];\n        let d3 = \u0026mut [0u8];\n        let d4 = \u0026mut [0u8];\n        let d5 = \u0026mut [0u8];\n\n        let infos = \u0026[\n            AccountInfo::new(\u0026k1, false, false, l1, d1, \u0026k1, false, 0),\n            AccountInfo::new(\u0026k2, false, false, l2, d2, \u0026k2, false, 0),\n            AccountInfo::new(\u0026k3, false, false, l3, d3, \u0026k3, false, 0),\n            AccountInfo::new(\u0026k4, false, false, l4, d4, \u0026k4, false, 0),\n            AccountInfo::new(\u0026k5, false, false, l5, d5, \u0026k5, false, 0),\n        ];\n        let infos_iter = \u0026mut infos.iter();\n        let info1 = next_account_info(infos_iter).unwrap();\n        let info2_3_4 = next_account_infos(infos_iter, 3).unwrap();\n        let info5 = next_account_info(infos_iter).unwrap();\n\n        assert_eq!(k1, *info1.key);\n        assert_eq!(k2, *info2_3_4[0].key);\n        assert_eq!(k3, *info2_3_4[1].key);\n        assert_eq!(k4, *info2_3_4[2].key);\n        assert_eq!(k5, *info5.key);\n    }\n\n    #[test]\n    fn test_account_info_as_ref() {\n        let k = Pubkey::new_unique();\n        let l = \u0026mut 0;\n        let d = \u0026mut [0u8];\n        let info = AccountInfo::new(\u0026k, false, false, l, d, \u0026k, false, 0);\n        assert_eq!(info.key, info.as_ref().key);\n    }\n\n    #[test]\n    fn test_account_info_debug_data() {\n        let key = Pubkey::new_unique();\n        let mut lamports = 42;\n        let mut data = vec![5; 80];\n        let data_str = format!(\"{:?}\", Hex(\u0026data[..MAX_DEBUG_ACCOUNT_DATA]));\n        let info = AccountInfo::new(\u0026key, false, false, \u0026mut lamports, \u0026mut data, \u0026key, false, 0);\n        assert_eq!(\n            format!(\"{info:?}\"),\n            format!(\n                \"AccountInfo {{ \\\n                key: {}, \\\n                owner: {}, \\\n                is_signer: {}, \\\n                is_writable: {}, \\\n                executable: {}, \\\n                rent_epoch: {}, \\\n                lamports: {}, \\\n                data.len: {}, \\\n                data: {}, .. }}\",\n                key,\n                key,\n                false,\n                false,\n                false,\n                0,\n                lamports,\n                data.len(),\n                data_str,\n            )\n        );\n\n        let mut data = vec![5; 40];\n        let data_str = format!(\"{:?}\", Hex(\u0026data));\n        let info = AccountInfo::new(\u0026key, false, false, \u0026mut lamports, \u0026mut data, \u0026key, false, 0);\n        assert_eq!(\n            format!(\"{info:?}\"),\n            fo pub authority: Pubkey,\n    pub bump: u8,\n    pub civilization: Civilization,\n    pub civilization_character_id: u16,\n    pub gender: Gender,\n    pub class: Option\u003cCharacterClass\u003e,\n    pub experience: u64,\n    pub stats: CoreStats,\n    pub attributes: Attributes,\n    pub energy: u16,\n    pub last_energy_refill: i64,\n    pub current_quest: Option\u003cCharacterQuestState\u003e,\n    pub current_recipe: Option\u003cCharacterRecipeState\u003e,\n    pub nft_mint: Pubkey,\n    pub nft_metadata: Pubkey,\n    pub nft_master_edition: Pubkey,\n    pub nft_token_account: Pubkey,\n    pub created_at: i64,\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, Debug, Default)]\npub struct CharacterQuestState {\n    pub quest_id: u16,\n    pub started_at: i64,\n    pub ready_at: i64,\n}\n\nimpl CharacterQuestState {\n    pub const SIZE: usize = 2 + 8 + 8;\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, Debug, Default)]\npub struct CharacterRecipeState {\n    pub recipe_id: u16,\n    pub started_at: i64,\n    pub ready_at: i64,\n}\n\nimpl CharacterRecipeState {\n    pub const SIZE: usize = 2 + 8 + 8;\n}\n\nimpl Character {\n    pub const LEN: usize = 8  // discriminator\n        + 32 // authority\n        + 1 // bump\n        + 1 // civilization enum\n        + 2 // civilization_character_id\n        + 1 // gender\n        + 1 // class option tag\n        + 1 // class value\n        + 8 // experience\n        + CoreStats::SIZE\n        + Attributes::SIZE\n        + 2 // energy\n        + 8 // last_energy_refill\n        + 1 // quest option tag\n        + CharacterQuestState::SIZE\n        + 1 // recipe option tag\n        + CharacterRecipeState::SIZE\n        + 32 // nft_mint\n        + 32 // nft_metadata\n        + 32 // nft_master_edition\n        + 32 // nft_token_account\n        + 8; // created_at\n\n    pub fn current_level(\u0026self) -\u003e u8 {\n        level_from_experience(self.experience)\n    }\n\n    pub fn total_core_points(\u0026self) -\u003e u16 {\n        total_core_points_for_level(self.current_level())\n    }\n\n    pub fn total_attribute_points(\u0026self) -\u003e u16 {\n        total_attribute_points_for_level(self.current_level())\n    }\n\n    pub fn spent_core_points(\u0026self) -\u003e i32 {\n        let base = self.civilization.base_stats();\n        let spent_might = self.stats.might as i32 - base.might as i32;\n        let spent_speed = self.stats.speed as i32 - base.speed as i32;\n        let spent_intellect = self.stats.intellect as i32 - base.intellect as i32;\n        spent_might + spent_speed + spent_intellect\n    }\n\n    pub fn spent_attribute_points(\u0026self) -\u003e i32 {\n        let base = self.civilization.base_attributes();\n        let spent_atk = self.attributes.atk as i32 - base.atk as i32;\n        let spent_def = self.attributes.def as i32 - base.def as i32;\n        let spent_mag_atk = self.attributes.mag_atk as i32 - base.mag_atk as i32;\n        let spent_mag_def = self.attributes.mag_def as i32 - base.mag_def as i32;\n        let spent_range = self.attributes.range as i32 - base.range as i32;\n        let spent_rate = self.attributes.rate as i32 - base.rate as i32;\n        spent_atk + spent_def + spent_mag_atk + spent_mag_def + spent_range + spent_rate\n    }\n\n    pub fn available_core_points(\u0026self) -\u003e i32 {\n        self.total_core_points() as i32 - self.spent_core_points()\n    }\n\n    pub fn available_attribute_points(\u0026self) -\u003e i32 {\n        self.total_attribute_points() as i32 - self.spent_attribute_points()\n    }\n\n    pub fn energy_capacity(\u0026self) -\u003e u16 {\n        Self::capacity_for_level(self.current_level())\n    }\n\n    fn capacity_for_level(level: u8) -\u003e u16 {\n        BASE_ENERGY + level.saturating_sub(1) as u16\n    }\n\n    pub fn ensure_identity(\u0026self, civilization: Civilization, character_id: u16) -\u003e Result\u003c()\u003e {\n        require_eq!(\n            self.civilization,\n            civilization,\n            ArisingError::InvalidCharacterAccount\n        );\n        require_eq!(\n            self.civilization_character_id,\n            character_id,\n            ArisingError::InvalidCharacterAccount\n        );\n        Ok(())\n    }\n\n    pub fn ensure_authority(\u0026self, authority: Pubkey) -\u003e Result\u003c()\u003e {\n        require_keys_eq!(authority, self.authority, ArisingError::Unauthorized);\n        Ok(())\n    }\n\n    pub fn grant_experience(\u0026mut self, amount: u64) -\u003e Result\u003c()\u003e {\n        let previous_level = self.current_level();\n        self.experience = self\n            .experience\n            .checked_add(amount)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        let new_level = self.current_level();\n        if new_level \u003e previous_level {\n            let prev_capacity = Self::capacity_for_level(previous_level);\n            let new_capacity = self.energy_capacity();\n            if new_capacity \u003e prev_capacity {\n                let gain = new_capacity - prev_capacity;\n                let increased = self\n                    .energy\n                    .checked_add(gain)\n                    .ok_or(ArisingError::ArithmeticOverflow)?;\n                self.energy = increased.min(new_capacity);\n            }\n        }\n        Ok(())\n    }\n\n    pub fn ensure_min_level(\u0026self, min_level: u8) -\u003e Result\u003c()\u003e {\n        require!(\n            self.current_level() \u003e= min_level,\n            ArisingError::ClassLevelRequirement\n        );\n        Ok(())\n    }\n\n    fn add_core_stats(\u0026mut self, delta: CoreStats) -\u003e Result\u003c()\u003e {\n        self.stats.might = self\n            .stats\n            .might\n            .checked_add(delta.might)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.stats.speed = self\n            .stats\n            .speed\n            .checked_add(delta.speed)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.stats.intellect = self\n            .stats\n            .intellect\n            .checked_add(delta.intellect)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        Ok(())\n    }\n\n    fn add_attributes(\u0026mut self, delta: Attributes) -\u003e Result\u003c()\u003e {\n        self.attributes.atk = self\n            .attributes\n            .atk\n            .checked_add(delta.atk)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.attributes.def = self\n            .attributes\n            .def\n            .checked_add(delta.def)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.attributes.mag_atk = self\n            .attributes\n            .mag_atk\n            .checked_add(delta.mag_atk)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.attributes.mag_def = self\n            .attributes\n            .mag_def\n            .checked_add(delta.mag_def)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.attributes.range = self\n            .attributes\n            .range\n            .checked_add(delta.range)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.attributes.rate = self\n            .attributes\n            .rate\n            .checked_add(delta.rate)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        Ok(())\n    }\n\n    pub fn allocate_core_stats(\u0026mut self, allocation: CoreStats) -\u003e Result\u003c()\u003e {\n        let allocation_total =\n            allocation.might as i32 + allocation.speed as i32 + allocation.intellect as i32;\n        require!(allocation_total \u003e 0, ArisingError::EmptyAllocation);\n\n        let available = self.available_core_points();\n        require!(\n            allocation_total \u003c= available,\n            ArisingError::InsufficientCorePoints\n        );\n\n        self.add_core_stats(allocation)\n    }\n\n    pub fn allocate_attributes(\u0026mut self, allocation: Attributes) -\u003e Result\u003c()\u003e {\n        require!(\n            allocation.atk \u003e= 0\n                \u0026\u0026 allocation.def \u003e= 0\n                \u0026\u0026 allocation.mag_atk \u003e= 0\n                \u0026\u0026 allocation.mag_def \u003e= 0\n                \u0026\u0026 allocation.range \u003e= 0\n                \u0026\u0026 allocation.rate \u003e= 0,\n            ArisingError::NegativeAllocation\n        );\n\n        let allocation_total = allocation.atk as i32\n            + allocation.def as i32\n            + allocation.mag_atk as i32\n            + allocation.mag_def as i32\n            + allocation.range as i32\n            + allocation.rate as i32;\n        require!(allocation_total \u003e 0, ArisingError::EmptyAllocation);\n\n        let available = self.available_attribute_points();\n        require!(\n            allocation_total \u003c= available,\n            ArisingError::InsufficientAttributePoints\n        );\n\n        self.add_attributes(allocation)\n    }\n\n    pub fn apply_class_choice(\u0026mut self, class: CharacterClass) -\u003e Result\u003c()\u003e {\n        require!(self.class.is_none(), ArisingError::ClassAlreadyChosen);\n        require_eq!(\n            class.civilization(),\n            self.civilization,\n            ArisingError::InvalidClassForCivilization\n        );\n        let bonus = class.bonuses();\n        self.add_core_stats(bonus.stats)?;\n        self.add_attributes(bonus.attributes)?;\n        self.class = Some(class);\n        Ok(())\n    }\n\n    pub fn consume_energy(\u0026mut self, amount: u16) -\u003e Result\u003c()\u003e {\n        if amount \u003e 0 {\n            require!(self.energy \u003e= amount, ArisingError::InsufficientEnergy);\n            self.energy = self\n                .energy\n                .checked_sub(amount)\n                .ok_or(ArisingError::ArithmeticOverflow)?;\n        }\n        Ok(())\n    }\n\n    pub fn refill_energy(\u0026mut self, now: i64) -\u003e Result\u003c()\u003e {\n        let elapsed = now\n            .checked_sub(self.last_energy_refill)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        require!(\n            elapsed \u003e= ENERGY_REFILL_COOLDOWN_SECS,\n            ArisingError::EnergyRefillCooldown\n        );\n        self.energy = self.energy_capacity();\n        self.last_energy_refill = now;\n        Ok(())\n    }\n\n    pub fn has_required_stats(\u0026self, required: CoreStats) -\u003e bool {\n        self.stats.might \u003e= required.might\n            \u0026\u0026 self.stats.speed \u003e= required.speed\n            \u0026\u0026 self.stats.intellect \u003e= required.intellect\n    }\n\n    pub fn start_quest(\u0026mut self, quest_id: u16, cooldown_seconds: u32, now: i64) -\u003e Result\u003c()\u003e {\n        require!(\n            self.current_quest.is_none(),\n            ArisingError::QuestAlreadyInProgress\n        );\n        let ready_in = i64::from(cooldown_seconds);\n        let ready_at = now\n            .checked_add(ready_in)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.current_quest = Some(CharacterQuestState {\n            quest_id,\n            started_at: now,\n            ready_at,\n        });\n        Ok(())\n    }\n\n    pub fn ensure_active_quest(\u0026self) -\u003e Result\u003c\u0026CharacterQuestState\u003e {\n        self.current_quest\n            .as_ref()\n            .ok_or(ArisingError::QuestNotInProgress.into())\n    }\n\n    pub fn clear_quest(\u0026mut self) -\u003e Result\u003cCharacterQuestState\u003e {\n        self.current_quest\n            .take()\n            .ok_or(ArisingError::QuestNotInProgress.into())\n    }\n\n    pub fn start_recipe(\u0026mut self, recipe_id: u16, cooldown_seconds: u32, now: i64) -\u003e Result\u003c()\u003e {\n        require!(\n            self.current_recipe.is_none(),\n            ArisingError::RecipeAlreadyInProgress\n        );\n        let ready_in = i64::from(cooldown_seconds);\n        let ready_at = now\n            .checked_add(ready_in)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        self.current_recipe = Some(CharacterRecipeState {\n            recipe_id,\n            started_at: now,\n            ready_at,\n        });\n        Ok(())\n    }\n\n    pub fn ensure_active_recipe(\u0026self) -\u003e Result\u003c\u0026CharacterRecipeState\u003e {\n        self.current_recipe\n            .as_ref()\n            .ok_or(ArisingError::RecipeNotInProgress.into())\n    }\n\n    pub fn clear_recipe(\u0026mut self) -\u003e Result\u003cCharacterRecipeState\u003e {\n        self.current_recipe\n            .take()\n            .ok_or(ArisingError::RecipeNotInProgress.into())\n    }\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy)]\npub struct CivilizationMintConfig {\n    pub next_id: u16,\n    pub cap: u16,\n}\n\nimpl CivilizationMintConfig {\n    pub const SIZE: usize = 2 + 2;\n\n    pub const fn new() -\u003e Self {\n        Self {\n            next_id: 1,\n            cap: 1000,\n        }\n    }\n}\n\n#[account]\npub struct CharacterMintState {\n    pub authority: Pubkey,\n    pub bump: u8,\n    pub collection_mint: Pubkey,\n    pub collection_metadata: Pubkey,\n    pub collection_master_edition: Pubkey,\n    pub civilization_mints: [CivilizationMintConfig; Civilization::COUNT],\n}\n\nimpl CharacterMintState {\n    pub const LEN: usize = 8 /* discriminator */\n        + 32 /* authority */\n        + 1 /* bump */\n        + 32 /* collection_mint */\n        + 32 /* collection_metadata */\n        + 32 /* collection_master_edition */\n        + Civilization::COUNT * CivilizationMintConfig::SIZE;\n\n    pub fn initialize(\n        \u0026mut self,\n        bump: u8,\n        authority: Pubkey,\n        collection_mint: Pubkey,\n        collection_metadata: Pubkey,\n        collection_master_edition: Pubkey,\n    ) {\n        self.bump = bump;\n        self.authority = authority;\n        self.collection_mint = collection_mint;\n        self.collection_metadata = collection_metadata;\n        self.collection_master_edition = collection_master_edition;\n        self.civilization_mints = [CivilizationMintConfig::new(); Civilization::COUNT];\n    }\n\n    pub fn ensure_authority(\u0026self, authority: Pubkey) -\u003e Result\u003c()\u003e {\n        require_keys_eq!(authority, self.authority, ArisingError::Unauthorized);\n        Ok(())\n    }\n\n    pub fn ensure_collection_binding(\n        \u0026self,\n        collection_mint: \u0026Pubkey,\n        collection_metadata: \u0026Pubkey,\n        collection_master_edition: \u0026Pubkey,\n    ) -\u003e Result\u003c()\u003e {\n        require_keys_eq!(\n            *collection_mint,\n            self.collection_mint,\n            ArisingError::InvalidCollectionMint\n        );\n        require_keys_eq!(\n            *collection_metadata,\n            self.collection_metadata,\n            ArisingError::InvalidCollectionMetadata\n        );\n        require_keys_eq!(\n            *collection_master_edition,\n            self.collection_master_edition,\n            ArisingError::InvalidCollectionMasterEdition\n        );\n        Ok(())\n    }\n\n    pub fn ensure_can_mint(\u0026self, civilization: Civilization, character_id: u16) -\u003e Result\u003c()\u003e {\n        let track = self.track(civilization);\n        require_eq!(\n            character_id,\n            track.next_id,\n            ArisingError::InvalidCharacterIdSequence\n        );\n        require!(\n            character_id \u003c= track.cap,\n            ArisingError::CivilizationCapReached\n        );\n        Ok(())\n    }\n\n    pub fn record_mint(\u0026mut self, civilization: Civilization) -\u003e Result\u003c()\u003e {\n        let track = self.track_mut(civilization);\n        track.next_id = track\n            .next_id\n            .checked_add(1)\n            .ok_or(ArisingError::ArithmeticOverflow)?;\n        Ok(())\n    }\n\n    pub fn track_mut(\u0026mut self, civilization: Civilization) -\u003e \u0026mut CivilizationMintConfig {\n        \u0026mut self.civilization_mints[civilization.as_index()]\n    }\n\n    pub fn track(\u0026self, civilization: Civilization) -\u003e \u0026CivilizationMintConfig {\n        \u0026self.civilization_mints[civilization.as_index()]\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::{\n        codex::{Attributes, CharacterClass, Civilization, Gender},\n        level_codex::{LEVEL_CAP, LEVEL_CURVE},\n    };\n    use anchor_lang::error::Error as AnchorError;\n\n    fn grant_levels(character: \u0026mut Character, target_level: u8) {\n        assert!(\n            target_level \u003e= 1 \u0026\u0026 target_level \u003c= LEVEL_CAP,\n            \"target level must be within curve\"\n        );\n        while character.current_level() \u003c target_level {\n            let current_level = character.current_level();\n            let curve_index = (current_level - 1) as usize;\n            character\n                .grant_experience(LEVEL_CURVE[curve_index].xp_to_next as u64)\n                .expect(\"experience applied\");\n        }\n    }\n\n    fn sample_character(civilization: Civilization) -\u003e Character {\n        Character {\n            authority: Pubkey::default(),\n            bump: 0,\n            civilization,\n            civilization_character_id: 1,\n            gender: Gender::Male,\n            class: None,\n            experience: 0,\n            stats: civilization.base_stats(),\n            attributes: civilization.base_attributes(),\n            energy: BASE_ENERGY,\n            last_energy_refill: 0,\n            current_quest: None,\n            current_recipe: None,\n            nft_mint: Pubkey::default(),\n            nft_metadata: Pubkey::default(),\n            nft_master_edition: Pubkey::default(),\n            nft_token_account: Pubkey::default(),\n            created_at: 0,\n        }\n    }\n\n    fn assert_error(err: AnchorError, expected: ArisingError) {\n        assert_eq!(err, AnchorError::from(expected));\n    }\n\n    #[test]\n    fn level_curve_is_respected() {\n        let mut character = sample_character(Civilization::Tarki);\n        assert_eq!(character.current_level(), 1);\n\n        for entry in LEVEL_CURVE.iter() {\n            assert_eq!(\n                character.current_level(),\n                entry.level,\n                \"character level should match curve entry before applying XP\"\n            );\n            character\n                .grant_experience(entry.xp_to_next as u64)\n                .expect(\"xp granted\");\n            let expected_level = (entry.level + 1).min(LEVEL_CAP);\n            assert_eq!(\n                character.current_level(),\n                expected_level,\n                \"character should reach next level when curve XP is applied\"\n            );\n        }\n\n        assert_eq!(character.current_level(), LEVEL_CAP);\n    }\n\n    #[test]\n    fn grant_experience_updates_energy_capacity() {\n        let mut character = sample_character(Civilization::Ard);\n        character.energy = Character::capacity_for_level(1);\n        character\n            .grant_experience(LEVEL_CURVE[0].xp_to_next as u64)\n            .expect(\"level up\");\n        assert_eq!(character.current_level(), 2);\n        assert_eq!(character.energy, Character::capacity_for_level(2));\n\n        let mut multi_level = sample_character(Civilization::Ard);\n        multi_level.energy = Character::capacity_for_level(1) - 2;\n        let xp_to_level_three = (LEVEL_CURVE[0].xp_to_next + LEVEL_CURVE[1].xp_to_next) as u64;\n        multi_level\n            .grant_experience(xp_to_level_three)\n            .expect(\"multi level up\");\n        assert_eq!(multi_level.current_level(), 3);\n        let gained = Character::capacity_for_level(3) - Character::capacity_for_level(1);\n        assert_eq!(\n            multi_level.energy,\n            Character::capacity_for_level(1) - 2 + gained\n        );\n    }\n\n    #[test]\n    fn allocate_core_stats_requires_available_points() {\n        let mut character = sample_character(Civilization::Hartenn);\n        let err = character\n            .allocate_core_stats(CoreStats::new(1, 0, 0))\n            .unwrap_err();\n        assert_error(err, ArisingError::InsufficientCorePoints);\n\n        character\n            .grant_experience(LEVEL_CURVE[0].xp_to_next as u64)\n            .expect(\"gain first level\");\n        assert_eq!(character.available_core_points(), 1);\n        character\n            .allocate_core_stats(CoreStats::new(1, 0, 0))\n            .expect(\"spend core point\");\n        assert_eq!(character.available_core_points(), 0);\n        assert_eq!(\n            character.stats.might,\n            Civilization::Hartenn.base_stats().might + 1\n        );\n    }\n\n    #[test]\n    fn refill_energy_enforces_cooldown() {\n        let mut character = sample_character(Civilization::Zhand);\n        character.energy = 0;\n        character.last_energy_refill = 0;\n        let err = character\n            .refill_energy(ENERGY_REFILL_COOLDOWN_SECS - 1)\n            .unwrap_err();\n        assert_error(err, ArisingError::EnergyRefillCooldown);\n        character\n            .refill_energy(ENERGY_REFILL_COOLDOWN_SECS)\n            .expect(\"cooldown satisfied\");\n        assert_eq!(character.energy, character.energy_capacity());\n    }\n\n    #[test]\n    fn quest_and_recipe_state_machine_enforces_exclusivity() {\n        let mut character = sample_character(Civilization::Ard);\n        character.start_quest(7, 10, 1).expect(\"should start quest\");\n        assert!(character.current_quest.is_some());\n        let err = character.start_quest(8, 20, 2).unwrap_err();\n        assert_error(err, ArisingError::QuestAlreadyInProgress);\n        let quest_state = character.clear_quest().expect(\"quest cleared\");\n        assert_eq!(quest_state.ready_at, 11);\n        assert!(character.current_quest.is_none());\n\n        character\n            .start_recipe(3, 15, 5)\n            .expect(\"should start recipe\");\n        let err = character.start_recipe(4, 25, 6).unwrap_err();\n        assert_error(err, ArisingError::RecipeAlreadyInProgress);\n        character.clear_recipe().expect(\"recipe cleared\");\n        assert!(character.current_recipe.is_none());\n    }\n\n    #[test]\n    fn allocate_attributes_validates_input() {\n        let mut character = sample_character(Civilization::Shinkari);\n        let err = character\n            .allocate_attributes(Attributes::new(-1, 0, 0, 0, 0, 0))\n            .unwrap_err();\n        assert_error(err, ArisingError::NegativeAllocation);\n\n        let err = character\n            .allocate_attributes(Attributes::zero())\n            .unwrap_err();\n        assert_error(err, ArisingError::EmptyAllocation);\n\n        grant_levels(\u0026mut character, 6);\n        assert_eq!(character.available_attribute_points(), 1);\n        character\n            .allocate_attributes(Attributes::new(1, 0, 0, 0, 0, 0))\n            .expect(\"spend attribute point\");\n        assert_eq!(\n            character.attributes.atk,\n            Civilization::Shinkari.base_attributes().atk + 1\n        );\n\n        let err = character\n            .allocate_attributes(Attributes::new(1, 1, 0, 0, 0, 0))\n            .unwrap_err();\n        assert_error(err, ArisingError::InsufficientAttributePoints);\n    }\n\n    #[test]\n    fn consume_energy_prevents_overdraw() {\n        let mut character = sample_character(Civilization::Hartenn);\n        character.energy = 5;\n        character\n            .consume_energy(0)\n            .expect(\"zero-cost actions should pass\");\n        assert_eq!(character.energy, 5);\n        character.consume_energy(3).expect(\"spend some energy\");\n        assert_eq!(character.energy, 2);\n        let err = character.consume_energy(3).unwrap_err();\n        assert_error(err, ArisingError::InsufficientEnergy);\n        assert_eq!(character.energy, 2, \"energy should remain unchanged\");\n    }\n\n    #[test]\n    fn ensure_active_quest_and_recipe_require_state() {\n        let mut character = sample_character(Civilization::Zhand);\n        let err = character.ensure_active_quest().unwrap_err();\n        assert_error(err, ArisingError::QuestNotInProgress);\n        let err = character.clear_quest().unwrap_err();\n        assert_error(err, ArisingError::QuestNotInProgress);\n\n        character\n            .start_quest(1, 5, 10)\n            .expect(\"start quest for state check\");\n        character.ensure_active_quest().expect(\"quest present\");\n        character.clear_quest().expect(\"quest cleared\");\n\n        let err = character.ensure_active_recipe().unwrap_err();\n        assert_error(err, ArisingError::RecipeNotInProgress);\n        let err = character.clear_recipe().unwrap_err();\n        assert_error(err, ArisingError::RecipeNotInProgress);\n\n        character\n            .start_recipe(1, 5, 20)\n            .expect(\"start recipe for state check\");\n        character.ensure_active_recipe().expect(\"recipe present\");\n        character.clear_recipe().expect(\"recipe cleared\");\n    }\n\n    #[test]\n    fn apply_class_choice_validates_civilization_and_duplicates() {\n        let mut character = sample_character(Civilization::Ard);\n        let err = character\n            .apply_class_choice(CharacterClass::HartennEngineer)\n            .unwrap_err();\n        assert_error(err, ArisingError::InvalidClassForCivilization);\n\n        character\n            .apply_class_choice(CharacterClass::ArdKnight)\n            .expect(\"valid class choice\");\n        assert_eq!(character.class, Some(CharacterClass::ArdKnight));\n\n        let err = character\n            .apply_class_choice(CharacterClass::ArdTemplar)\n            .unwrap_err();\n        assert_error(err, ArisingError::ClassAlreadyChosen);\n    }\n}\n","traces": ata_uri(self, character_id: u16) -\u003e String {\n        format!(\n            \"https://mints-{}.playarising.com/metadata/{}\",\n            self.slug(),\n            character_id\n        )\n    }\n\n    pub const fn seed_bytes(self) -\u003e [u8; 1] {\n        [self as u8]\n    }\n\n    pub const fn base_stats(self) -\u003e CoreStats {\n        match self {\n            Civilization::Ard =\u003e CoreStats::new(3, 2, 1),\n            Civilization::Hartenn =\u003e CoreStats::new(3, 1, 2),\n            Civilization::Ikarans =\u003e CoreStats::new(1, 3, 2),\n            Civilization::Zhand =\u003e CoreStats::new(1, 2, 3),\n            Civilization::Shinkari =\u003e CoreStats::new(2, 3, 1),\n            Civilization::Tarki =\u003e CoreStats::new(3, 2, 1),\n        }\n    }\n\n    pub const fn base_attributes(self) -\u003e Attributes {\n        match self {\n            Civilization::Ard =\u003e Attributes::new(2, 1, 0, 0, 0, 0),\n            Civilization::Hartenn =\u003e Attributes::new(1, 0, 0, 2, 0, 0),\n            Civilization::Ikarans =\u003e Attributes::new(1, 0, 0, 0, 1, 1),\n            Civilization::Zhand =\u003e Attributes::new(0, 0, 2, 0, 0, 1),\n            Civilization::Shinkari =\u003e Attributes::new(1, 0, 1, 0, 0, 1),\n            Civilization::Tarki =\u003e Attributes::new(2, 0, 0, 0, 0, 1),\n        }\n    }\n\n    pub const fn passive(self) -\u003e PassiveEffect {\n        match self {\n            Civilization::Ard =\u003e PassiveEffect::KnightsHonor,\n            Civilization::Hartenn =\u003e PassiveEffect::ForgeMastery,\n            Civilization::Ikarans =\u003e PassiveEffect::SylvanGrace,\n            Civilization::Zhand =\u003e PassiveEffect::DuneCunning,\n            Civilization::Shinkari =\u003e PassiveEffect::ArtisanFocus,\n            Civilization::Tarki =\u003e PassiveEffect::RaidersFortune,\n        }\n    }\n\n    pub const fn display_name(self) -\u003e \u0026'static str {\n        match self {\n            Civilization::Ard =\u003e \"Ard\",\n            Civilization::Hartenn =\u003e \"Hartenn\",\n            Civilization::Ikarans =\u003e \"I'karans\",\n            Civilization::Zhand =\u003e \"Zhand\",\n            Civilization::Shinkari =\u003e \"Shinkari\",\n            Civilization::Tarki =\u003e \"Tark'i\",\n        }\n    }\n}\n\nimpl fmt::Display for Civilization {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.display_name())\n    }\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, PartialEq, Eq)]\npub enum PassiveEffect {\n    KnightsHonor,\n    ForgeMastery,\n    SylvanGrace,\n    DuneCunning,\n    ArtisanFocus,\n    RaidersFortune,\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, Debug, PartialEq, Eq)]\npub enum CharacterClass {\n    ArdKnight,\n    ArdTemplar,\n    HartennEngineer,\n    HartennWarden,\n    IkaransRanger,\n    IkaransDruid,\n    ZhandSandblade,\n    ZhandSeer,\n    ShinkariSamurai,\n    ShinkariOnmyoji,\n    TarkiRaider,\n    TarkiSkald,\n}\n\npub struct ClassBonus {\n    pub stats: CoreStats,\n    pub attributes: Attributes,\n}\n\nimpl CharacterClass {\n    pub fn civilization(self) -\u003e Civilization {\n        match self {\n            CharacterClass::ArdKnight | CharacterClass::ArdTemplar =\u003e Civilization::Ard,\n            CharacterClass::HartennEngineer | CharacterClass::HartennWarden =\u003e {\n                Civilization::Hartenn\n            }\n            CharacterClass::IkaransRanger | CharacterClass::IkaransDruid =\u003e Civilization::Ikarans,\n            CharacterClass::ZhandSandblade | CharacterClass::ZhandSeer =\u003e Civilization::Zhand,\n            CharacterClass::ShinkariSamurai | CharacterClass::ShinkariOnmyoji =\u003e {\n                Civilization::Shinkari\n            }\n            CharacterClass::TarkiRaider | CharacterClass::TarkiSkald =\u003e Civilization::Tarki,\n        }\n    }\n\n    pub fn bonuses(self) -\u003e ClassBonus {\n        match self {\n            CharacterClass::ArdKnight =\u003e ClassBonus {\n                stats: CoreStats::new(1, 0, 0),\n                attributes: Attributes::new(0, 2, 0, 0, 0, 0),\n            },\n            CharacterClass::ArdTemplar =\u003e ClassBonus {\n                stats: CoreStats::new(0, 0, 1),\n                attributes: Attributes::new(0, 1, 0, 1, 0, 0),\n            },\n            CharacterClass::HartennEngineer =\u003e ClassBonus {\n                stats: CoreStats::new(0, 0, 1),\n                attributes: Attributes::new(0, 0, 2, 0, 0, 0),\n            },\n            CharacterClass::HartennWarden =\u003e ClassBonus {\n                stats: CoreStats::new(1, 0, 0),\n                attributes: Attributes::new(1, 1, 0, 0, 0, 0),\n            },\n            CharacterClass::IkaransRanger =\u003e ClassBonus {\n                stats: CoreStats::new(0, 1, 0),\n                attributes: Attributes::new(1, 0, 0, 0, 1, 0),\n            },\n            CharacterClass::IkaransDruid =\u003e ClassBonus {\n                stats: CoreStats::new(0, 0, 1),\n                attributes: Attributes::new(0, 0, 0, 2, 0, 0),\n            },\n            CharacterClass::ZhandSandblade =\u003e ClassBonus {\n                stats: CoreStats::new(0, 1, 0),\n                attributes: Attributes::new(0, 0, 0, 0, 0, 2),\n            },\n            CharacterClass::ZhandSeer =\u003e ClassBonus {\n                stats: CoreStats::new(0, 0, 1),\n                attributes: Attributes::new(0, 0, 2, 0, 0, 0),\n            },\n            CharacterClass::ShinkariSamurai =\u003e ClassBonus {\n                stats: CoreStats::new(1, 0, 0),\n                attributes: Attributes::new(1, 0, 0, 0, 0, 1),\n            },\n            CharacterClass::ShinkariOnmyoji =\u003e ClassBonus {\n                stats: CoreStats::new(0, 0, 1),\n                attributes: Attributes::new(0, 0, 1, 1, 0, 0),\n            },\n            CharacterClass::TarkiRaider =\u003e ClassBonus {\n                stats: CoreStats::new(1, 0, 0),\n                attributes: Attributes::new(2, 0, 0, 0, 0, 0),\n            },\n            CharacterClass::TarkiSkald =\u003e ClassBonus {\n                stats: CoreStats::new(0, 1, 0),\n                attributes: Attributes::new(0, 0, 0, 0, 1, 1),\n            },\n        }\n    }\n\n    pub fn options_for(civilization: Civilization) -\u003e \u0026'static [CharacterClass; 2] {\n        match civilization {\n            Civilization::Ard =\u003e \u0026[CharacterClass::ArdKnight, CharacterClass::ArdTemplar],\n            Civilization::Hartenn =\u003e \u0026[\n                CharacterClass::HartennEngineer,\n                CharacterClass::HartennWarden,\n            ],\n            Civilization::Ikarans =\u003e \u0026[CharacterClass::IkaransRanger, CharacterClass::IkaransDruid],\n            Civilization::Zhand =\u003e \u0026[CharacterClass::ZhandSandblade, CharacterClass::ZhandSeer],\n            Civilization::Shinkari =\u003e \u0026[\n                CharacterClass::ShinkariSamurai,\n                CharacterClass::ShinkariOnmyoji,\n            ],\n            Civilization::Tarki =\u003e \u0026[CharacterClass::TarkiRaider, CharacterClass::TarkiSkald],\n        }\n    }\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy)]\npub struct CoreStats {\n    pub might: u16,\n    pub speed: u16,\n    pub intellect: u16,\n}\n\nimpl CoreStats {\n    pub const SIZE: usize = 2 + 2 + 2;\n\n    pub const fn new(might: u16, speed: u16, intellect: u16) -\u003e Self {\n        Self {\n            might,\n            speed,\n            intellect,\n        }\n    }\n\n    pub const fn zero() -\u003e Self {\n        Self::new(0, 0, 0)\n    }\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy)]\npub struct Attributes {\n    pub atk: i16,\n    pub def: i16,\n    pub mag_atk: i16,\n    pub mag_def: i16,\n    pub range: i16,\n    pub rate: i16,\n}\n\nimpl Attributes {\n    pub const SIZE: usize = 2 * 6;\n\n    pub const fn new(\n        atk: i16,\n        def: i16,\n        mag_atk: i16,\n        mag_def: i16,\n        range: i16,\n        rate: i16,\n    ) -\u003e Self {\n        Self {\n            atk,\n            def,\n            mag_atk,\n            mag_def,\n            range,\n            rate,\n        }\n    }\n\n    pub const fn zero() -\u003e Self {\n        Self::new(0, 0, 0, 0, 0, 0)\n    }\n}\n\npub struct CivilizationCodexEntry {\n    pub civilization: Civilization,\n    pub base_stats: CoreStats,\n    pub base_attributes: Attributes,\n    pub passive: PassiveEffect,\n}\n\npub const CIVILIZATION_CODEX: [CivilizationCodexEntry; 6] = [\n    CivilizationCodexEntry {\n        civilization: Civilization::Ard,\n        base_stats: Civilization::Ard.base_stats(),\n        base_attributes: Civilization::Ard.base_attributes(),\n        passive: Civilization::Ard.passive(),\n    },\n    CivilizationCodexEntry {\n        civilization: Civilization::Hartenn,\n        base_stats: Civilization::Hartenn.base_stats(),\n        base_attributes: Civilization::Hartenn.base_attributes(),\n        passive: Civilization::Hartenn.passive(),\n    },\n    CivilizationCodexEntry {\n        civilization: Civilization::Ikarans,\n        base_stats: Civilization::Ikarans.base_stats(),\n        base_attributes: Civilization::Ikarans.base_attributes(),\n        passive: Civilization::Ikarans.passive(),\n    },\n    CivilizationCodexEntry {\n        civilization: Civilization::Zhand,\n        base_stats: Civilization::Zhand.base_stats(),\n        base_attributes: Civilization::Zhand.base_attributes(),\n        passive: Civilization::Zhand.passive(),\n    },\n    CivilizationCodexEntry {\n        civilization: Civilization::Shinkari,\n        base_stats: Civilization::Shinkari.base_stats(),\n        base_attributes: Civilization::Shinkari.base_attributes(),\n        passive: Civilization::Shinkari.passive(),\n    },\n    CivilizationCodexEntry {\n        civilization: Civilization::Tarki,\n        base_stats: Civilization::Tarki.base_stats(),\n        base_attributes: Civilization::Tarki.base_attributes(),\n        passive: Civilization::Tarki.passive(),\n    },\n];\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, PartialEq, Eq)]\npub enum QuestType {\n    Job,\n    Farm,\n    Raid,\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, PartialEq, Eq)]\npub enum ResourceKind {\n    Gold,\n    Log,\n    Plank,\n    WoodenSword,\n}\n\nimpl ResourceKind {\n    pub const fn seed_bytes(self) -\u003e \u0026'static [u8] {\n        match self {\n            ResourceKind::Gold =\u003e b\"gold\",\n            ResourceKind::Log =\u003e b\"log\",\n            ResourceKind::Plank =\u003e b\"plank\",\n            ResourceKind::WoodenSword =\u003e b\"wooden_sword\",\n        }\n    }\n\n    pub const fn decimals(self) -\u003e u8 {\n        0\n    }\n\n    pub const fn symbol(self) -\u003e \u0026'static str {\n        match self {\n            ResourceKind::Gold =\u003e \"GOLD\",\n            ResourceKind::Log =\u003e \"LOG\",\n            ResourceKind::Plank =\u003e \"PLANK\",\n            ResourceKind::WoodenSword =\u003e \"WOOD_SWORD\",\n        }\n    }\n}\n\n#[derive(Clone, Copy)]\npub enum QuestReward {\n    Experience { amount: u64 },\n    Resource { resource: ResourceKind, amount: u64 },\n}\n\nimpl QuestReward {\n    pub const fn experience(amount: u64) -\u003e Self {\n        Self::Experience { amount }\n    }\n\n    pub const fn resource(resource: ResourceKind, amount: u64) -\u003e Self {\n        Self::Resource { resource, amount }\n    }\n}\n\npub struct QuestCodexEntry {\n    pub id: u16,\n    pub quest_type: QuestType,\n    pub name: \u0026'static str,\n    pub level_required: u8,\n    pub cooldown_seconds: u32,\n    pub base_energy_cost: u16,\n    pub minimum_stats: CoreStats,\n    pub rewards: \u0026'static [QuestReward],\n}\n\nimpl QuestCodexEntry {\n    pub const fn new(\n        id: u16,\n        quest_type: QuestType,\n        name: \u0026'static str,\n        level_required: u8,\n        cooldown_seconds: u32,\n        base_energy_cost: u16,\n        minimum_stats: CoreStats,\n        rewards: \u0026'static [QuestReward],\n    ) -\u003e Self {\n        Self {\n            id,\n            quest_type,\n            name,\n            level_required,\n            cooldown_seconds,\n            base_energy_cost,\n            minimum_stats,\n            rewards,\n        }\n    }\n\n    fn efficiency(\u0026self, stats: CoreStats) -\u003e f32 {\n        fn ratio(stat: u16, requirement: u16) -\u003e f32 {\n            if requirement == 0 {\n                f32::INFINITY\n            } else {\n                stat as f32 / requirement as f32\n            }\n        }\n\n        let might = ratio(stats.might, self.minimum_stats.might);\n        let speed = ratio(stats.speed, self.minimum_stats.speed);\n        let intellect = ratio(stats.intellect, self.minimum_stats.intellect);\n\n        might.min(speed).min(intellect)\n    }\n\n    pub fn energy_cost(\u0026self, stats: CoreStats) -\u003e u16 {\n        let eff = self.efficiency(stats);\n        if eff \u003e= 1.5 {\n            return 0;\n        }\n\n        let penalty = if eff \u003c= 0.0 {\n            1.5\n        } else {\n            (1.0 / eff).clamp(1.0, 1.5)\n        };\n\n        let energy = f32::from(self.base_energy_cost) * penalty;\n        energy.ceil().min(u16::MAX as f32) as u16\n    }\n\n    pub fn stats_satisfied(\u0026self, stats: CoreStats) -\u003e bool {\n        stats.might \u003e= self.minimum_stats.might\n            \u0026\u0026 stats.speed \u003e= self.minimum_stats.speed\n            \u0026\u0026 stats.intellect \u003e= self.minimum_stats.intellect\n    }\n}\n\nconst CARAVAN_GUARD_REWARDS: [QuestReward; 1] = [QuestReward::resource(ResourceKind::Gold, 100)];\nconst WOODCUTTING_REWARDS: [QuestReward; 1] = [QuestReward::resource(ResourceKind::Log, 1)];\nconst BANDIT_CAMP_REWARDS: [QuestReward; 1] = [QuestReward::experience(50)];\n\npub const QUEST_CODEX: [QuestCodexEntry; 3] = [\n    QuestCodexEntry::new(\n        1,\n        QuestType::Job,\n        \"Caravan Guard\",\n        1,\n        60 * 60,\n        5,\n        CoreStats::new(0, 1, 1),\n        \u0026CARAVAN_GUARD_REWARDS,\n    ),\n    QuestCodexEntry::new(\n        2,\n        QuestType::Farm,\n        \"Woodcutting\",\n        1,\n        60 * 60,\n        5,\n        CoreStats::new(1, 1, 0),\n        \u0026WOODCUTTING_REWARDS,\n    ),\n    QuestCodexEntry::new(\n        3,\n        QuestType::Raid,\n        \"Bandit Camp\",\n        1,\n        60 * 60,\n        7,\n        CoreStats::new(1, 0, 1),\n        \u0026BANDIT_CAMP_REWARDS,\n    ),\n];\n\npub fn quest_by_id(id: u16) -\u003e Option\u003c\u0026'static QuestCodexEntry\u003e {\n    if id == 0 {\n        return None;\n    }\n    let idx = (id - 1) as usize;\n    QUEST_CODEX.get(idx)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn quest_lookup_returns_expected_entries() {\n        assert_eq!(quest_by_id(1).unwrap().name, \"Caravan Guard\");\n        assert_eq!(quest_by_id(2).unwrap().name, \"Woodcutting\");\n        assert_eq!(quest_by_id(3).unwrap().name, \"Bandit Camp\");\n    }\n\n    #[test]\n    fn quest_energy_cost_and_requirements_behave_as_expected() {\n        let quest = quest_by_id(2).expect(\"woodcutting quest\");\n        assert!(quest.stats_satisfied(quest.minimum_stats));\n        let exact_cost = quest.energy_cost(quest.minimum_stats);\n        assert_eq!(exact_cost, quest.base_energy_cost);\n\n        let low_stats = CoreStats::zero();\n        assert!(!quest.stats_satisfied(low_stats));\n        assert_eq!(\n            quest.energy_cost(low_stats),\n            (f32::from(quest.base_energy_cost) * 1.5).ceil() as u16\n        );\n\n        let overqualified = CoreStats::new(\n            quest.minimum_stats.might + 5,\n            quest.minimum_stats.speed + 5,\n            quest.minimum_stats.intellect + 5,\n        );\n        assert_eq!(quest.energy_cost(overqualified), 0);\n    }\n\n    #[test]\n    fn recipe_energy_cost_matches_quest_logic() {\n        let recipe = recipe_by_id(2).expect(\"wooden sword recipe\");\n        assert!(recipe.stats_satisfied(recipe.minimum_stats));\n        assert_eq!(\n            recipe.energy_cost(recipe.minimum_stats),\n            recipe.base_energy_cost\n        );\n\n        let insufficient = CoreStats::zero();\n        assert!(!recipe.stats_satisfied(insufficient));\n        assert_eq!(\n            recipe.energy_cost(insufficient),\n            (f32::from(recipe.base_energy_cost) * 1.5).ceil() as u16\n        );\n\n        let generous_stats = CoreStats::new(\n            recipe.minimum_stats.might + 10,\n            recipe.minimum_stats.speed + 10,\n            recipe.minimum_stats.intellect + 10,\n        );\n        assert_eq!(recipe.energy_cost(generous_stats), 0);\n    }\n}\n\n#[derive(AnchorSerialize, AnchorDeserialize, Clone, Copy, PartialEq, Eq)]\npub enum RecipeType {\n    Forge,\n    Craft,\n}\n\n#[derive(Clone, Copy)]\npub enum RecipeInput {\n    Forge {\n        raw_material: ResourceKind,\n        amount: u64,\n    },\n    Craft {\n        base_material: ResourceKind,\n        base_amount: u64,\n        gold_amount: u64,\n    },\n}\n\n#[derive(Clone, Copy)]\npub enum RecipeOutput {\n    Resource { resource: ResourceKind, amount: u64 },\n}\n\npub struct RecipeCodexEntry {\n    pub id: u16,\n    pub recipe_type: RecipeType,\n    pub name: \u0026'static str,\n    pub level_required: u8,\n    pub cooldown_seconds: u32,\n    pub base_energy_cost: u16,\n    pub minimum_stats: CoreStats,\n    pub input: RecipeInput,\n    pub output: RecipeOutput,\n}\n\nimpl RecipeCodexEntry {\n    pub const fn new(\n        id: u16,\n        recipe_type: RecipeType,\n        name: \u0026'static str,\n        level_required: u8,\n        cooldown_seconds: u32,\n        base_energy_cost: u16,\n        minimum_stats: CoreStats,\n        input: RecipeInput,\n        output: RecipeOutput,\n    ) -\u003e Self {\n        Self {\n            id,\n            recipe_type,\n            name,\n            level_required,\n            cooldown_seconds,\n            base_energy_cost,\n            minimum_stats,\n            input,\n            output,\n        }\n    }\n\n    fn efficiency(\u0026self, stats: CoreStats) -\u003e f32 {\n        fn ratio(stat: u16, requirement: u16) -\u003e f32 {\n            if requirement == 0 {\n                f32::INFINITY\n            } else {\n                stat as f32 / requirement as f32\n            }\n        }\n\n        let might = ratio(stats.might, self.minimum_stats.might);\n        let speed = ratio(stats.speed, self.minimum_stats.speed);\n        let intellect = ratio(stats.intellect, self.minimum_stats.intellect);\n\n        might.min(speed).min(intellect)\n    }\n\n    pub fn energy_cost(\u0026self, stats: CoreStats) -\u003e u16 {\n        let eff = self.efficiency(stats);\n        if eff \u003e= 1.5 {\n            return 0;\n        }\n\n        let penalty = if eff \u003c= 0.0 {\n            1.5\n        } else {\n            (1.0 / eff).clamp(1.0, 1.5)\n        };\n\n        let energy = f32::from(self.base_energy_cost) * penalty;\n        energy.ceil().min(u16::MAX as f32) as u16\n    }\n\n    pub fn stats_satisfied(\u0026self, stats: CoreStats) -\u003e bool {\n        stats.might \u003e= self.minimum_stats.might\n            \u0026\u0026 stats.speed \u003e= self.minimum_stats.speed\n            \u0026\u0026 stats.intellect \u003e= self.minimum_stats.intellect\n    }\n}\n\npub const RECIPE_CODEX: [RecipeCodexEntry; 2] = [\n    RecipeCodexEntry::new(\n        1,\n        RecipeType::Forge,\n        \"Plank Forging\",\n        1,\n        60 * 60,\n        5,\n        CoreStats::new(1, 0, 0),\n        RecipeInput::Forge {\n            raw_material: ResourceKind::Log,\n            amount: 1,\n        },\n        RecipeOutput::Resource {\n            resource: ResourceKind::Plank,\n            amount: 1,\n        },\n    ),\n    RecipeCodexEntry::new(\n        2,\n        RecipeType::Craft,\n        \"Wooden Sword\",\n        1,\n        2 * 60 * 60,\n        7,\n        CoreStats::new(1, 0, 1),\n        RecipeInput::Craft {\n            base_material: ResourceKind::Plank,\n            base_amount: 2,\n            gold_amount: 50,\n        },\n        RecipeOutput::Resource {\n            resource: ResourceKind::WoodenSword,\n            amount: 1,\n        },\n    ),\n];\n\npub fn recipe_by_id(id: u16) -\u003e Option\u003c\u0026'static RecipeCodexEntry\u003e {\n    RECIPE_CODEX.iter().find(|recipe| recipe.id == id)\n}\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":20}},{"line":58,"address":[],"length":0,"stats":{"Line":20}},{"line":59,"address":[],"length":0,"stats":{"Line e, collection_mint_bump: u8) -\u003e Result\u003c()\u003e {\n    if accounts.collection_mint.to_account_info().data_is_empty() {\n        let rent = Rent::get()?;\n        let lamports = rent.minimum_balance(spl_token::state::Mint::LEN);\n\n        let create_ix = system_instruction::create_account(\n            \u0026accounts.authority.key(),\n            \u0026accounts.collection_mint.key(),\n            lamports,\n            spl_token::state::Mint::LEN as u64,\n            \u0026accounts.token_program.key(),\n        );\n        let collection_mint_signer: \u0026[\u0026[u8]] = \u0026[COLLECTION_MINT_PDA_SEED, \u0026[collection_mint_bump]];\n        invoke_signed(\n            \u0026create_ix,\n            \u0026[\n                accounts.authority.to_account_info(),\n                accounts.collection_mint.to_account_info(),\n                accounts.system_program.to_account_info(),\n            ],\n            \u0026[collection_mint_signer],\n        )?;\n\n        token::initialize_mint(\n            CpiContext::new(\n                accounts.token_program.to_account_info(),\n                token::InitializeMint {\n                    mint: accounts.collection_mint.to_account_info(),\n                    rent: accounts.rent.to_account_info(),\n                },\n            ),\n            0,\n            \u0026accounts.mint_state.key(),\n            Some(\u0026accounts.mint_state.key()),\n        )?;\n    }\n\n    Ok(())\n}\n\nfn ensure_collection_token_account(\n    accounts: \u0026Initialize\u003c'_\u003e,\n    collection_token_bump: u8,\n    mint_state_signer: \u0026[\u0026[\u0026[u8]]],\n) -\u003e Result\u003c()\u003e {\n    if accounts\n        .collection_token_account\n        .to_account_info()\n        .data_is_empty()\n    {\n        let rent = Rent::get()?;\n        let lamports = rent.minimum_balance(spl_token::state::Account::LEN);\n\n        let create_ix = system_instruction::create_account(\n            \u0026accounts.authority.key(),\n ion_uri,\n        seller_fee_basis_points: 0,\n        creators: Some(vec![Creator {\n            address: accounts.mint_state.key(),\n            verified: true,\n            share: 100,\n        }]),\n        collection: None,\n        uses: None,\n    };\n\n    if accounts.collection_metadata.data_is_empty() {\n        let metadata_ix = CreateMetadataAccountV3 {\n            metadata: accounts.collection_metadata.key(),\n            mint: accounts.collection_mint.key(),\n            mint_authority: accounts.mint_state.key(),\n            payer: accounts.authority.key(),\n            update_authority: (accounts.mint_state.key(), true),\n            system_program: anchor_lang::solana_program::system_program::ID,\n            rent: Some(sysvar::rent::id()),\n        }\n        .instruction(CreateMetadataAccountV3InstructionArgs {\n            data: metadata_data,\n            is_mutable: false,\n            collection_details: Some(CollectionDetails::V1 { size: 0 }),\n        });\n\n        let metadata_infos = [\n            accounts.collection_metadata.to_account_info(),\n            accounts.collection_mint.to_account_info(),\n            accounts.mint_state.to_account_info(),\n            accounts.authority.to_account_info(),\n            accounts.mint_state.to_account_info(),\n            accounts.system_program.to_account_info(),\n            accounts.rent.to_account_info(),\n            accounts.token_metadata_program.to_account_info(),\n        ];\n        invoke_signed(\u0026metadata_ix, \u0026metadata_infos, mint_state_signer)?;\n    }\n\n    if accounts.collection_master_edition.data_is_empty() {\n        let master_ix = CreateMasterEditionV3 {\n            edition: accounts.collection_master_edition.key(),\n            mint: accounts.collection_mint.key(),\n            update_authority: accounts.mint_state.key(),\n            mint_authority: accounts.mint_state.key(),\n            payer: accounts.authority.key(),\n            metadata: accounts.collecti , character_id)?;\n        }\n\n        let metadata = CharacterMetadataArgs {\n            name: format!(\"Arising: {}\", civilization.display_name()),\n            symbol: \"ARISING\".to_owned(),\n            uri: civilization.metadata_uri(character_id),\n        };\n\n        let signer_seeds: \u0026[\u0026[\u0026[u8]]] = \u0026[\u0026[CHARACTER_MINT_STATE_SEED, \u0026[mint_state_bump]]];\n        mint_character_nft(\u0026ctx.accounts, \u0026metadata, signer_seeds)?;\n\n        let character = \u0026mut ctx.accounts.character;\n        character.authority = ctx.accounts.authority.key();\n        character.bump = ctx.bumps.character;\n        character.civilization = civilization;\n        character.civilization_character_id = character_id;\n        character.gender = gender;\n        character.class = None;\n        character.experience = 0;\n        character.stats = civilization.base_stats();\n        character.attributes = civilization.base_attributes();\n        character.nft_mint = ctx.accounts.character_mint.key();\n        character.nft_metadata = ctx.accounts.metadata.key();\n        character.nft_master_edition = ctx.accounts.master_edition.key();\n        character.nft_token_account = ctx.accounts.character_token_account.key();\n        character.created_at = Clock::get()?.unix_timestamp;\n        character.energy = character.energy_capacity();\n        character.last_energy_refill = character.created_at;\n        character.current_quest = None;\n        character.current_recipe = None;\n\n        ctx.accounts.mint_state.record_mint(civilization)?;\n\n        Ok(())\n    }\n\n    pub fn update_civilization_cap(\n        ctx: Context\u003cUpdateCivilizationCap\u003e,\n        civilization: Civilization,\n        new_cap: u16,\n    ) -\u003e Result\u003c()\u003e {\n        ctx.accounts\n            .mint_state\n            .ensure_authority(ctx.accounts.authority.key())?;\n\n        let track = ctx.accounts.mint_state.track_mut(civilization);\n        let

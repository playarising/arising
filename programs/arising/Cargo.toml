[package]
name = "arising"
version = "1.0.0"
description = "Arising is a Solana RPG where NFT heroes evolve by completing jobs and quests in real time."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arising"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"
mpl-token-metadata = "5"
solana-program = "2.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

name: Anchor CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: metadaoproject/setup-solana@v1.0

      - uses: metadaoproject/setup-anchor@v3.3

      - name: Generate new keygen
        run: solana-keygen new
        
      - name: Sync Keys
        run: anchor sync
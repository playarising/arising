[package]
name = "arising"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arising"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
mpl-bubblegum = "2.1.1"
spl-account-compression = { version = "1.0.0", features = ["no-entrypoint"] }
spl-noop = { version = "1.0.0", features = ["no-entrypoint"] }
solana-program-keccak = { package = "solana-program", version = "1.18.26", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

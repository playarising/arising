name: Anchor CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUST_TOOLCHAIN: "1.89.0"
  BUN_VERSION: "1.1.9"
  SOLANA_CLI_VERSION: "v1.18.17"
  ANCHOR_CLI_VERSION: "0.32.1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libudev-dev build-essential

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/${SOLANA_CLI_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install --locked anchor-cli --version "${ANCHOR_CLI_VERSION}"

      - name: Set up Bun toolchain
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Generate new keygen
        run: solana-keygen new --no-bip39-passphrase --force

      - name: Sync Keys
        run: anchor sync

      - name: Build
        run: anchor build

      - name: Test
        run: bun run test

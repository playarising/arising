[package]
name = "arising"
version = "1.0.0"
description = "Arising is a Solana RPG where NFT heroes evolve by completing jobs and quests in real time."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arising"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"
mpl-token-metadata = "5"

[dev-dependencies]
litesvm = { git = "https://github.com/LiteSVM/litesvm", version = "0.8", branch = "master" }
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-message = "3"
solana-transaction = "3"
solana-transaction-error = "3"
solana-clock = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        character.consume_energy(amount)\n    }\n\n    pub fn refill_energy(\n        ctx: Context\u003cModifyCharacterOwned\u003e,\n        civilization: Civilization,\n        character_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        let now = Clock::get()?.unix_timestamp;\n        character.refill_energy(now)\n    }\n\n    pub fn start_quest(\n        ctx: Context\u003cModifyCharacterOwned\u003e,\n        civilization: Civilization,\n        character_id: u16,\n        quest_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let quest = quest_by_id(quest_id).ok_or(ArisingError::InvalidQuest)?;\n        let character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        character.ensure_min_level(quest.level_required)?;\n        require!(\n            character.has_required_stats(quest.minimum_stats),\n            ArisingError::QuestRequirementsNotMet\n        );\n\n        let now = Clock::get()?.unix_timestamp;\n        let energy_cost = quest.energy_cost(character.stats);\n        character.consume_energy(energy_cost)?;\n        character.start_quest(quest.id, quest.cooldown_seconds, now)?;\n        let quest_state = character.ensure_active_quest()?;\n\n        emit!(QuestStartedEvent {\n            civilization,\n            character_id,\n            authority: character.authority,\n            quest_id: quest.id,\n            quest_type: quest.quest_type,\n            quest_name: quest.name.to_string(),\n            ready_at: quest_state.ready_at,\n            energy_spent: energy_cost,\n        });\n\n        Ok(())\n    }\n\n    pub fn claim_quest\u003c'info\u003e(\n        ctx: Context\u003c'_, '_, 'info, 'info, ClaimQuest\u003c'info\u003e\u003e,\n        civilization: Civilization,\n        character_id: u16,\n        quest_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let quest = quest_by_id(quest_id).ok_or(ArisingError::InvalidQuest)?;\n        let character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        let progress = character.ensure_active_quest()?;\n        require_eq!(progress.quest_id, quest.id, ArisingError::QuestMismatch);\n\n        let now = Clock::get()?.unix_timestamp;\n        require!(now \u003e= progress.ready_at, ArisingError::QuestNotReady);\n\n        let mut experience_reward: u64 = 0;\n        let mut resource_rewards: Vec\u003cResourceRewardEvent\u003e = Vec::new();\n        let mut remaining_accounts = ctx.remaining_accounts.iter();\n\n        for reward in quest.rewards.iter().copied() {\n            match reward {\n                QuestReward::Experience { amount } =\u003e {\n                    character.grant_experience(amount)?;\n                    experience_reward = experience_reward.saturating_add(amount);\n                }\n                QuestReward::Resource { resource, amount } =\u003e {\n                    let reward_event = mint_resource_reward(\n                        \u0026ctx.accounts.mint_state,\n                        \u0026ctx.accounts.token_program,\n                        \u0026ctx.accounts.associated_token_program,\n                        \u0026ctx.accounts.system_program,\n                        \u0026ctx.accounts.rent,\n                        \u0026ctx.accounts.authority,\n                        ctx.program_id,\n                        ctx.bumps.mint_state,\n                        resource,\n                        amount,\n                        \u0026mut remaining_accounts,\n                    )?;\n                    resource_rewards.push(reward_event);\n                }\n            }\n        }\n\n        character.clear_quest()?;\n\n        emit!(QuestClaimedEvent {\n            civilization,\n            character_id,\n            authority: character.authority,\n            quest_id: quest.id,\n            quest_type: quest.quest_type,\n            quest_name: quest.name.to_string(),\n            experience_reward,\n            resource_rewards,\n        });\n\n        Ok(())\n    }\n\n    pub fn start_recipe\u003c'info\u003e(\n        ctx: Context\u003c'_, '_, 'info, 'info, ProcessRecipe\u003c'info\u003e\u003e,\n        civilization: Civilization,\n        character_id: u16,\n        recipe_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let recipe = recipe_by_id(recipe_id).ok_or(ArisingError::InvalidRecipe)?;\n        let character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        character.ensure_min_level(recipe.level_required)?;\n        require!(\n            character.has_required_stats(recipe.minimum_stats),\n            ArisingError::RecipeRequirementsNotMet\n        );\n\n        let now = Clock::get()?.unix_timestamp;\n        let energy_cost = recipe.energy_cost(character.stats);\n        character.consume_energy(energy_cost)?;\n\n        let mut consumed_resources: Vec\u003cResourceCostEvent\u003e = Vec::new();\n        let mut remaining_accounts = ctx.remaining_accounts.iter();\n        match recipe.input {\n            RecipeInput::Forge {\n                raw_material,\n                amount,\n            } =\u003e {\n                let cost = consume_resource_from_user(\n                    ctx.program_id,\n                    \u0026ctx.accounts.token_program,\n                    \u0026ctx.accounts.authority,\n                    raw_material,\n                    amount,\n                    \u0026mut remaining_accounts,\n                )?;\n                consumed_resources.push(cost);\n            }\n            RecipeInput::Craft {\n                base_material,\n                base_amount,\n                gold_amount,\n            } =\u003e {\n                let base_cost = consume_resource_from_user(\n                    ctx.program_id,\n                    \u0026ctx.accounts.token_program,\n                    \u0026ctx.accounts.authority,\n                    base_material,\n                    base_amount,\n                    \u0026mut remaining_accounts,\n                )?;\n                consumed_resources.push(base_cost);\n                let gold_cost = consume_resource_from_user(\n                    ctx.program_id,\n                    \u0026ctx.accounts.token_program,\n                    \u0026ctx.accounts.authority,\n                    ResourceKind::Gold,\n                    gold_amount,\n                    \u0026mut remaining_accounts,\n                )?;\n                consumed_resources.push(gold_cost);\n            }\n        }\n\n        character.start_recipe(recipe.id, recipe.cooldown_seconds, now)?;\n        let recipe_state = character.ensure_active_recipe()?;\n\n        emit!(RecipeStartedEvent {\n            civilization,\n            character_id,\n            authority: character.authority,\n            recipe_id: recipe.id,\n            recipe_type: recipe.recipe_type,\n            recipe_name: recipe.name.to_string(),\n            ready_at: recipe_state.ready_at,\n            energy_spent: energy_cost,\n            resources_consumed: consumed_resources,\n        });\n\n        Ok(())\n    }\n\n    pub fn claim_recipe\u003c'info\u003e(\n        ctx: Context\u003c'_, '_, 'info, 'info, ProcessRecipe\u003c'info\u003e\u003e,\n        civilization: Civilization,\n        character_id: u16,\n        recipe_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let recipe = recipe_by_id(recipe_id).ok_or(ArisingError::InvalidRecipe)?;\n        let character = \u0026mut ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n        character.ensure_authority(ctx.accounts.authority.key())?;\n        let progress = character.ensure_active_recipe()?;\n        require_eq!(progress.recipe_id, recipe.id, ArisingError::RecipeMismatch);\n\n        let now = Clock::get()?.unix_timestamp;\n        require!(now \u003e= progress.ready_at, ArisingError::RecipeNotReady);\n\n        let mut outputs: Vec\u003cResourceRewardEvent\u003e = Vec::new();\n        let mut remaining_accounts = ctx.remaining_accounts.iter();\n        match recipe.output {\n            RecipeOutput::Resource { resource, amount } =\u003e {\n                let event = mint_resource_reward(\n                    \u0026ctx.accounts.mint_state,\n                    \u0026ctx.accounts.token_program,\n                    \u0026ctx.accounts.associated_token_program,\n                    \u0026ctx.accounts.system_program,\n                    \u0026ctx.accounts.rent,\n                    \u0026ctx.accounts.authority,\n                    ctx.program_id,\n                    ctx.bumps.mint_state,\n                    resource,\n                    amount,\n                    \u0026mut remaining_accounts,\n                )?;\n                outputs.push(event);\n            }\n        }\n\n        character.clear_recipe()?;\n\n        emit!(RecipeClaimedEvent {\n            civilization,\n            character_id,\n            authority: character.authority,\n            recipe_id: recipe.id,\n            recipe_type: recipe.recipe_type,\n            recipe_name: recipe.name.to_string(),\n            resource_rewards: outputs,\n        });\n\n        Ok(())\n    }\n\n    pub fn get_character_metadata(\n        ctx: Context\u003cGetCharacterMetadata\u003e,\n        civilization: Civilization,\n        character_id: u16,\n    ) -\u003e Result\u003c()\u003e {\n        let character = \u0026ctx.accounts.character;\n        character.ensure_identity(civilization, character_id)?;\n\n        emit!(CharacterMetadataEvent {\n            civilization,\n            character_id,\n            authority: character.authority,\n            gender: character.gender,\n            level: character.current_level(),\n            experience: character.experience,\n            class: character.class,\n            energy: character.energy,\n            energy_capacity: character.energy_capacity(),\n            last_energy_refill: character.last_energy_refill,\n            base_stats: civilization.base_stats(),\n            stats: character.stats,\n            base_attributes: civilization.base_attributes(),\n            attributes: character.attributes,\n            available_core_points: character.available_core_points(),\n            available_attribute_points: character.available_attribute_points(),\n            passive: civilization.passive(),\n            nft_mint: character.nft_mint,\n            nft_metadata: character.nft_metadata,\n            nft_master_edition: character.nft_master_edition,\n            nft_token_account: character.nft_token_account,\n            created_at: character.created_at,\n            current_recipe: character.current_recipe,\n            current_quest: character.current_quest,\n        });\n\n        Ok(())\n    }\n}\n\nfn mint_resource_reward\u003c'info\u003e(\n    mint_state: \u0026Account\u003c'info, CharacterMintState\u003e,\n    token_program: \u0026Program\u003c'info, Token\u003e,\n    associated_token_program: \u0026Program\u003c'info, AssociatedToken\u003e,\n    system_program: \u0026Program\u003c'info, System\u003e,\n    rent: \u0026Sysvar\u003c'info, Rent\u003e,\n    authority: \u0026Signer\u003c'info\u003e,\n    program_id: \u0026Pubkey,\n    mint_state_bump: u8,\n    resource: ResourceKind,\n    amount: u64,\n    remaining_accounts: \u0026mut std::slice::Iter\u003c'info, AccountInfo\u003c'info\u003e\u003e,\n) -\u003e Result\u003cResourceRewardEvent\u003e {\n    let mint_info = remaining_accounts\n        .next()\n        .ok_or(ArisingError::MissingRewardAccounts)?;\n    let destination_info = remaining_accounts\n        .next()\n        .ok_or(ArisingError::MissingRewardAccounts)?;\n\n    let (expected_mint, mint_bump) =\n        Pubkey::find_program_address(\u0026[RESOURCE_MINT_SEED, resource.seed_bytes()], program_id);\n    require_keys_eq!(\n        mint_info.key(),\n        expected_mint,\n        ArisingError::InvalidResourceMint\n    );\n\n    if mint_info.data_is_empty() {\n        initialize_resource_mint(\n            mint_state,\n            token_program,\n            system_program,\n            rent,\n            authority,\n            mint_info,\n            resource,\n            mint_bump,\n        )?;\n    }\n\n    if destination_info.data_is_empty() {\n        let expected_ata =\n            associated_token::get_associated_token_address(\u0026authority.key(), \u0026mint_info.key());\n        require_keys_eq!(\n            destination_info.key(),\n            expected_ata,\n            ArisingError::InvalidResourceAccount\n        );\n\n        associated_token::create(CpiContext::new(\n            associated_token_program.to_account_info(),\n            associated_token::Create {\n                payer: authority.to_account_info(),\n                associated_token: destination_info.clone(),\n                authority: authority.to_account_info(),\n                mint: mint_info.clone(),\n                system_program: system_program.to_account_info(),\n                token_program: token_program.to_account_info(),\n            },\n        ))?;\n    }\n\n    let destination_account = Account::\u003cTokenAccount\u003e::try_from(destination_info)\n        .map_err(|_| ArisingError::InvalidResourceAccount)?;\n    require_keys_eq!(\n        destination_account.owner,\n        authority.key(),\n        ArisingError::InvalidResourceAccount\n    );\n    require_keys_eq!(\n        destination_account.mint,\n        mint_info.key(),\n        ArisingError::InvalidResourceAccount\n    );\n\n    let signer_seeds: \u0026[\u0026[u8]] = \u0026[CHARACTER_MINT_STATE_SEED, \u0026[mint_state_bump]];\n\n    token::mint_to(\n        CpiContext::new_with_signer(\n            token_program.to_account_info(),\n            token::MintTo {\n                mint: mint_info.clone(),\n                to: destination_account.to_account_info(),\n                authority: mint_state.to_account_info(),\n            },\n            \u0026[signer_seeds],\n        ),\n        amount,\n    )?;\n\n    Ok(ResourceRewardEvent {\n        resource,\n        amount,\n        destination: destination_account.key(),\n    })\n}\n\nfn initialize_resource_mint\u003c'info\u003e(\n    mint_state: \u0026Account\u003c'info, CharacterMintState\u003e,\n    token_program: \u0026Program\u003c'info, Token\u003e,\n    system_program: \u0026Program\u003c'info, System\u003e,\n    rent: \u0026Sysvar\u003c'info, Rent\u003e,\n    authority: \u0026Signer\u003c'info\u003e,\n    mint_info: \u0026AccountInfo\u003c'info\u003e,\n    resource: ResourceKind,\n    mint_bump: u8,\n) -\u003e Result\u003c()\u003e {\n    let rent_lamports = rent.minimum_balance(spl_token::state::Mint::LEN);\n    let create_ix = system_instruction::create_account(\n        \u0026authority.key(),\n        mint_info.key,\n        rent_lamports,\n        spl_token::state::Mint::LEN as u64,\n        \u0026token_program.key(),\n    );\n    invoke_signed(\n        \u0026create_ix,\n        \u0026[\n            authority.to_account_info(),\n            mint_info.clone(),\n            system_program.to_account_info(),\n        ],\n        \u0026[\u0026[RESOURCE_MINT_SEED, resource.seed_bytes(), \u0026[mint_bump]]],\n    )?;\n\n    token::initialize_mint(\n        CpiContext::new(\n            token_program.to_account_info(),\n            token:     )\n    .assert_success();\n\n    let outsider = Keypair::new();\n    ctx.svm.airdrop(\u0026outsider.pubkey(), 1_000_000_000).unwrap();\n    ctx.execute_instruction(\n        instructions::update_civilization_cap(\n            mint_state,\n            conversions::keypair_pubkey(\u0026outsider),\n            Civilization::Ard,\n            20,\n        ),\n        \u0026[\u0026outsider],\n    )\n    .assert_anchor_error(ArisingError::Unauthorized);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","eabz","Documents","GitHub","arising","programs","arising","tests","litesvm_failures.rs"],"content":"#[path = \"common/mod.rs\"]\nmod common;\n\nuse arising::codex::{Civilization, CoreStats, Gender, ResourceKind};\nuse arising::errors::ArisingError;\nuse common::{\n    context::{TestContext, TransactionResultExt},\n    conversions, fixtures, instructions, tokens,\n};\nuse solana_keypair::Keypair;\nuse solana_signer::Signer;\n\n#[test]\nfn cannot_claim_before_ready() {\n    let mut ctx = TestContext::new();\n    let mint_state = fixtures::create_mint_state(\u0026mut ctx);\n    let authority = Keypair::new();\n    ctx.svm.airdrop(\u0026authority.pubkey(), 1_000_000_000).unwrap();\n    let authority_pk = conversions::keypair_pubkey(\u0026authority);\n    let gatherer = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Ard,\n        1,\n        \u0026authority,\n        Gender::Male,\n        None,\n    );\n\n    ctx.execute_instruction(\n        instructions::start_quest(Civilization::Ard, 1, 1, gatherer, authority_pk),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n\n    ctx.execute_instruction(\n        instructions::claim_quest(\n            Civilization::Ard,\n            1,\n            1,\n            gatherer,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Gold]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_anchor_error(ArisingError::QuestNotReady);\n}\n\n#[test]\nfn quest_requires_stats() {\n    let mut ctx = TestContext::new();\n    let authority = Keypair::new();\n    ctx.svm.airdrop(\u0026authority.pubkey(), 1_000_000_000).unwrap();\n    let authority_pk = conversions::keypair_pubkey(\u0026authority);\n    let weak_character = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Hartenn,\n        4,\n        \u0026authority,\n        Gender::Male,\n        Some(CoreStats::zero()),\n    );\n\n    ctx.execute_instruction(\n        instructions::start_quest(Civilization::Hartenn, 4, 3, weak_character, authority_pk),\n        \u0026[\u0026authority],\n    )\n    .assert_anchor_error(ArisingError::QuestRequirementsNotMet);\n}\n\n#[test]\nfn recipe_consumes_available_resources() {\n    let mut ctx = TestContext::new();\n    let mint_state = fixtures::create_mint_state(\u0026mut ctx);\n    let authority = Keypair::new();\n    ctx.svm.airdrop(\u0026authority.pubkey(), 1_000_000_000).unwrap();\n    let authority_pk = conversions::keypair_pubkey(\u0026authority);\n    let crafter = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Ard,\n        9,\n        \u0026authority,\n        Gender::Female,\n        None,\n    );\n\n    // No resources yet; starting the recipe should fail.\n    tokens::seed_resource_balance(\n        \u0026mut ctx,\n        \u0026mint_state,\n        \u0026authority_pk,\n        ResourceKind::Gold,\n        100,\n    );\n    ctx.execute_instruction(\n        instructions::start_recipe(\n            Civilization::Ard,\n            9,\n            2,\n            crafter,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Plank, ResourceKind::Gold]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_anchor_error(ArisingError::InvalidResourceAccount);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","eabz","Documents","GitHub","arising","programs","arising","tests","litesvm_flow.rs"],"content":"#[path = \"common/mod.rs\"]\nmod common;\n\nuse arising::codex::{Civilization, Gender, ResourceKind};\nuse common::{\n    clock,\n    context::{TestContext, TransactionResultExt},\n    conversions, fixtures, instructions, tokens,\n};\nuse solana_keypair::Keypair;\nuse solana_signer::Signer;\n\n#[test]\nfn quest_and_recipe_flow() {\n    let mut ctx = TestContext::new();\n    let mint_state = fixtures::create_mint_state(\u0026mut ctx);\n    let authority = Keypair::new();\n    ctx.svm.airdrop(\u0026authority.pubkey(), 5_000_000_000).unwrap();\n    let authority_pk = conversions::keypair_pubkey(\u0026authority);\n\n    let gatherer = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Ard,\n        1,\n        \u0026authority,\n        Gender::Male,\n        None,\n    );\n    let forger = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Ard,\n        2,\n        \u0026authority,\n        Gender::Female,\n        None,\n    );\n    let crafter = fixtures::create_character(\n        \u0026mut ctx,\n        Civilization::Ard,\n        3,\n        \u0026authority,\n        Gender::Male,\n        None,\n    );\n\n    tokens::seed_resource_balance(\u0026mut ctx, \u0026mint_state, \u0026authority_pk, ResourceKind::Log, 1);\n\n    ctx.execute_instruction(\n        instructions::start_quest(Civilization::Ard, 1, 1, gatherer, authority_pk),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n    clock::fast_forward_quest(\u0026mut ctx, \u0026gatherer);\n    ctx.execute_instruction(\n        instructions::claim_quest(\n            Civilization::Ard,\n            1,\n            1,\n            gatherer,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Gold]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n\n    ctx.execute_instruction(\n        instructions::start_quest(Civilization::Ard, 1, 2, gatherer, authority_pk),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n    clock::fast_forward_quest(\u0026mut ctx, \u0026gatherer);\n    ctx.execute_instruction(\n        instructions::claim_quest(\n            Civilization::Ard,\n            1,\n            2,\n            gatherer,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Log]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n\n    for _ in 0..2 {\n        ctx.execute_instruction(\n            instructions::start_recipe(\n                Civilization::Ard,\n                2,\n                1,\n                forger,\n                authority_pk,\n                mint_state,\n                tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Log]),\n            ),\n            \u0026[\u0026authority],\n        )\n        .assert_success();\n        clock::fast_forward_recipe(\u0026mut ctx, \u0026forger);\n        ctx.execute_instruction(\n            instructions::claim_recipe(\n                Civilization::Ard,\n                2,\n                1,\n                forger,\n                authority_pk,\n                mint_state,\n                tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Plank]),\n            ),\n            \u0026[\u0026authority],\n        )\n        .assert_success();\n    }\n\n    ctx.execute_instruction(\n        instructions::start_recipe(\n            Civilization::Ard,\n            3,\n            2,\n            crafter,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::Plank, ResourceKind::Gold]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n    clock::fast_forward_recipe(\u0026mut ctx, \u0026crafter);\n    ctx.execute_instruction(\n        instructions::claim_recipe(\n            Civilization::Ard,\n            3,\n            2,\n            crafter,\n            authority_pk,\n            mint_state,\n            tokens::reward_accounts(\u0026authority_pk, \u0026[ResourceKind::WoodenSword]),\n        ),\n        \u0026[\u0026authority],\n    )\n    .assert_success();\n\n    assert_eq!(\n        tokens::token_balance(\u0026ctx, \u0026authority_pk, ResourceKind::Gold),\n        50\n    );\n    assert_eq!(\n        tokens::token_balance(\u0026ctx, \u0026authority_pk, ResourceKind::Log),\n        0\n    );\n    assert_eq!(\n        tokens::token_balance(\u0026ctx, \u0026authority_pk, ResourceKind::Plank),\n        0\n    );\n    assert_eq!(\n        tokens::token_balance(\u0026ctx, \u0026authority_pk, ResourceKind::WoodenSword),\n        1\n    );\n\n    let crafter_after = ctx.get_anchor_account::\u003carising::character::Character\u003e(\u0026crafter);\n    assert!(crafter_after.current_recipe.is_none());\n}\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e(
        'code',
        {
          className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        },
        line,
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
